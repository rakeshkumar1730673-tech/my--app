<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(#4ec0ca, #2c8f9c);
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  #gameCanvas {
    background: linear-gradient(#70c5ce, #a8e6cf);
    border: 4px solid #333;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #overlay {
    position: absolute;
    color: white;
    text-align: center;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #score {
    font-size: 48px;
    font-weight: bold;
  }
  #message {
    font-size: 20px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="overlay">
  <div id="score">0</div>
  <div id="message">Tap / Click / Space to start</div>
</div>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const messageEl = document.getElementById('message');

let bird, pipes, frame, score, gameState, bestScore = 0;

function init() {
  bird = { x: 80, y: 250, w: 30, h: 24, vel: 0, gravity: 0.45, jump: -8 };
  pipes = [];
  frame = 0;
  score = 0;
  gameState = 'ready'; // ready, playing, over
  scoreEl.textContent = '0';
  messageEl.textContent = 'Tap / Click / Space to start';
}

function flap() {
  if (gameState === 'ready') {
    gameState = 'playing';
    messageEl.textContent = '';
  }
  if (gameState === 'playing') {
    bird.vel = bird.jump;
  }
  if (gameState === 'over') {
    init();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });

function spawnPipe() {
  const gap = 150;
  const minH = 50;
  const maxH = canvas.height - gap - minH - 100; // leave room for ground
  const topH = Math.floor(Math.random() * (maxH - minH)) + minH;
  pipes.push({ x: canvas.width, w: 52, topH: topH, gap: gap, passed: false });
}

function update() {
  if (gameState !== 'playing') return;

  frame++;
  bird.vel += bird.gravity;
  bird.y += bird.vel;

  if (frame % 90 === 0) spawnPipe();

  pipes.forEach(p => p.x -= 3);
  pipes = pipes.filter(p => p.x + p.w > 0);

  pipes.forEach(p => {
    if (!p.passed && p.x + p.w < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }
  });

  // collisions
  const groundY = canvas.height - 40;
  if (bird.y + bird.h > groundY || bird.y < 0) {
    endGame();
  }

  pipes.forEach(p => {
    const birdRight = bird.x + bird.w;
    const birdLeft = bird.x;
    const birdTop = bird.y;
    const birdBottom = bird.y + bird.h;

    if (birdRight > p.x && birdLeft < p.x + p.w) {
      if (birdTop < p.topH || birdBottom > p.topH + p.gap) {
        endGame();
      }
    }
  });
}

function endGame() {
  if (gameState === 'over') return;
  gameState = 'over';
  if (score > bestScore) bestScore = score;
  messageEl.textContent = `Game Over! Best: ${bestScore} — Tap to retry`;
}

function drawBackground() {
  ctx.fillStyle = '#70c5ce';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ground
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
  ctx.fillStyle = '#c2b280';
  ctx.fillRect(0, canvas.height - 40, canvas.width, 6);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
  const angle = Math.min(Math.max(bird.vel * 0.05, -0.5), 0.9);
  ctx.rotate(angle);
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(bird.w / 4, -bird.h / 6, 3, 0, Math.PI * 2);
  ctx.fill();
  // beak
  ctx.fillStyle = '#ff8c00';
  ctx.beginPath();
  ctx.moveTo(bird.w / 2, 0);
  ctx.lineTo(bird.w / 2 + 10, -3);
  ctx.lineTo(bird.w / 2 + 10, 3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPipes() {
  pipes.forEach(p => {
    ctx.fillStyle = '#4caf50';
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 3;
    // top pipe
    ctx.fillRect(p.x, 0, p.w, p.topH);
    ctx.strokeRect(p.x, 0, p.w, p.topH);
    // bottom pipe
    const bottomY = p.topH + p.gap;
    ctx.fillRect(p.x, bottomY, p.w, canvas.height - bottomY - 40);
    ctx.strokeRect(p.x, bottomY, p.w, canvas.height - bottomY - 40);
    // caps
    ctx.fillRect(p.x - 4, p.topH - 20, p.w + 8, 20);
    ctx.strokeRect(p.x - 4, p.topH - 20, p.w + 8, 20);
    ctx.fillRect(p.x - 4, bottomY, p.w + 8, 20);
    ctx.strokeRect(p.x - 4, bottomY, p.w + 8, 20);
  });
}

function draw() {
  drawBackground();
  drawPipes();
  drawBird();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
